<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonlit Candy Atelier - 運命の6マスをチェック！</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #120524;
            color: #fce7f3;
        }
        .cinzel-font {
            font-family: 'Cinzel', serif;
        }
        .glow-gold {
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.7), 0 0 20px rgba(251, 191, 36, 0.4);
        }
        .glass-panel {
            background: rgba(30, 10, 50, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(234, 179, 8, 0.45);
            box-shadow: 0 0 30px rgba(88, 28, 135, 0.6), inset 0 0 15px rgba(234, 179, 8, 0.2);
        }
        /* コイン回転アニメーション */
        @keyframes coinSpin {
            0% { transform: rotateY(0deg) scale(1); }
            50% { transform: rotateY(1080deg) scale(1.15); }
            100% { transform: rotateY(2160deg) scale(1); }
        }
        .animate-spin-coin {
            animation: coinSpin 1s cubic-bezier(0.15, 0.85, 0.35, 1.2) forwards;
        }
        .menu-card {
            transition: all 0.2s ease;
        }
        .menu-card.active-highlight {
            transform: scale(1.04);
            border-color: #f59e0b !important;
            background: rgba(120, 53, 15, 0.8) !important;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.8);
        }
    </style>
</head>
<body class="min-h-screen bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-purple-950 via-[#170833] to-[#0a0214] py-8 px-4 flex flex-col items-center">

    <div class="max-w-md w-full mx-auto space-y-6">
        
        <!-- ヘッダータイトル -->
        <header class="text-center space-y-1">
            <p class="text-[11px] cinzel-font tracking-widest text-amber-300">KAMUKURA REI HALLOWEEN SPECIAL</p>
            <h1 class="cinzel-font text-2xl md:text-3xl font-black text-amber-400 glow-gold tracking-wider">
                Moonlit Candy Atelier
            </h1>
            <p class="text-[11px] text-purple-300 tracking-wider">🌙 月夜の魔法菓子店 ── ROULETTE MENU</p>
        </header>

        <!-- 【1】コイントスセクション -->
        <section class="glass-panel rounded-2xl p-4 text-center relative overflow-hidden">
            <h2 class="cinzel-font text-base font-bold text-amber-300 mb-1 flex items-center justify-center gap-2">
                <span>🪙</span> COIN TOSS <span>🪙</span>
            </h2>
            <p class="text-[11px] text-purple-200 mb-3">コインを投げて、運命のルートを決めよう！</p>

            <!-- コイン表示部 -->
            <div class="flex justify-center mb-3">
                <div id="coin-container" class="w-20 h-20 rounded-full bg-gradient-to-br from-amber-200 via-yellow-400 to-amber-600 p-1 shadow-xl shadow-amber-500/30 flex items-center justify-center border-2 border-amber-100">
                    <div id="coin" class="w-full h-full rounded-full border border-amber-900/40 flex flex-col items-center justify-center bg-gradient-to-tr from-amber-500 to-yellow-300 text-purple-950 font-black cinzel-font text-xs shadow-inner">
                        <span id="coin-text" class="text-[11px] tracking-tighter font-black">TRICK</span>
                        <span class="text-[8px] opacity-75">or</span>
                        <span id="coin-subtext" class="text-[11px] tracking-tighter font-black">TREAT</span>
                    </div>
                </div>
            </div>

            <!-- トスボタン -->
            <button onclick="tossCoin()" id="coin-btn" class="w-full py-2.5 bg-gradient-to-r from-amber-400 via-yellow-400 to-amber-500 text-purple-950 font-black rounded-xl shadow-lg hover:brightness-110 active:scale-95 transition-all cinzel-font tracking-wider text-xs border border-amber-200">
                COIN TOSS START
            </button>
            <div id="coin-result" class="mt-2 text-xs font-bold text-amber-300 h-5"></div>
        </section>

        <!-- 【2】ルーレットセクション：TRICK (6マス一覧) -->
        <section class="glass-panel rounded-2xl p-4 space-y-3 border-purple-600/50">
            <div class="flex items-center justify-between">
                <h3 class="cinzel-font text-sm font-bold text-purple-300 flex items-center gap-1.5">
                    <span>👻</span> TRICK 運命の6マス
                </h3>
                <span class="text-[10px] bg-purple-900/80 text-purple-200 px-2 py-0.5 rounded-full border border-purple-700">全6種</span>
            </div>

            <!-- 6マス一覧グリッド -->
            <div class="grid grid-cols-2 gap-2" id="trick-grid">
                <!-- JSで動的生成 -->
            </div>

            <button onclick="spinRoulette('trick')" id="trick-btn" class="w-full py-2.5 bg-gradient-to-r from-purple-700 via-purple-800 to-purple-950 text-purple-100 font-bold rounded-xl shadow hover:brightness-110 active:scale-95 transition-all text-xs cinzel-font tracking-wider border border-purple-500/50">
                TRICK ルーレット START
            </button>
        </section>

        <!-- 【3】ルーレットセクション：TREAT (6マス一覧) -->
        <section class="glass-panel rounded-2xl p-4 space-y-3 border-amber-600/50">
            <div class="flex items-center justify-between">
                <h3 class="cinzel-font text-sm font-bold text-amber-300 flex items-center gap-1.5">
                    <span>🍬</span> TREAT 運命の6マス
                </h3>
                <span class="text-[10px] bg-amber-900/80 text-amber-200 px-2 py-0.5 rounded-full border border-amber-700">全6種</span>
            </div>

            <!-- 6マス一覧グリッド -->
            <div class="grid grid-cols-2 gap-2" id="treat-grid">
                <!-- JSで動的生成 -->
            </div>

            <button onclick="spinRoulette('treat')" id="treat-btn" class="w-full py-2.5 bg-gradient-to-r from-amber-700 via-amber-800 to-amber-950 text-amber-100 font-bold rounded-xl shadow hover:brightness-110 active:scale-95 transition-all text-xs cinzel-font tracking-wider border border-amber-500/50">
                TREAT ルーレット START
            </button>
        </section>

        <!-- 【4】結果履歴セクション -->
        <section class="glass-panel rounded-2xl p-4">
            <div class="flex items-center justify-between mb-2">
                <h3 class="cinzel-font text-xs font-bold text-amber-300 flex items-center gap-1">
                    <span>📜</span> RESULT HISTORY
                </h3>
                <button onclick="clearHistory()" class="text-[10px] text-purple-300 hover:text-amber-300 underline transition-colors">
                    履歴をクリア
                </button>
            </div>
            <div id="history-list" class="space-y-1.5 max-h-40 overflow-y-auto pr-1 text-xs">
                <div class="text-center text-purple-400/70 py-3 italic text-[11px]">
                    まだ結果の履歴はありません
                </div>
            </div>
        </section>

        <!-- フッター特記事項 -->
        <footer class="text-center text-[10px] text-purple-400 space-y-1 pb-4">
            <p>1000Cで好きな番号を指定できるよ！</p>
            <p class="cinzel-font text-purple-500">KAMUKURA REI / REALITY</p>
        </footer>

    </div>

    <!-- JavaScript ロジック -->
    <script>
        const trickItems = [
            { id: 1, name: "小悪魔のいたずら", desc: "Lv.1のビーンズ1粒 😈" },
            { id: 2, name: "魔女の気まぐれ", desc: "Lv.2のビーンズ1粒 🔮" },
            { id: 3, name: "禁断の一粒", desc: "Lv.3のビーンズ1粒 👑" },
            { id: 4, name: "リスナーの悪だくみ", desc: "Lv.1～3を指定 ❓" },
            { id: 5, name: "いたずら回避！", desc: "チョコ1個 🍫" },
            { id: 6, name: "運命の一粒", desc: "全レベルからランダム 🎁" }
        ];

        const treatItems = [
            { id: 1, name: "チョコ", desc: "チョコ1個 🍫" },
            { id: 2, name: "神座と乾杯！", desc: "乾杯タイム 🥂" },
            { id: 3, name: "差し入れギフト", desc: "食べ物系ギフト(任意) 🎁" },
            { id: 4, name: "おつまみ", desc: "おつまみひと口 🧀" },
            { id: 5, name: "神座と乾杯！", desc: "乾杯タイム 🥂" },
            { id: 6, name: "ご褒美セレクト", desc: "チョコ or おつまみ 🤎" }
        ];

        let historyData = [];

        // 初期描画：6マス一覧を生成
        function renderGrids() {
            const trickGrid = document.getElementById('trick-grid');
            trickGrid.innerHTML = trickItems.map(item => `
                <div id="trick-card-${item.id}" class="menu-card bg-purple-950/70 border border-purple-800/80 rounded-xl p-2.5 flex flex-col justify-between">
                    <div class="flex items-center justify-between text-[11px] font-bold text-purple-300">
                        <span>①②③④⑤⑥"[item.id]</span>
                        <span class="text-[9px] text-purple-400">No.${item.id}</span>
                    </div>
                    <div class="my-1">
                        <div class="text-xs font-bold text-pink-100 truncate">${item.name}</div>
                        <div class="text-[10px] text-purple-300 truncate">${item.desc}</div>
                    </div>
                </div>
            `).join('').replace(/①②③④⑤⑥"\[item\.id\]/g, (match, offset, str) => {
                // 正しくIDに置き換えるための安全な置換処理
                return '';
            });

            // より確実なテンプレートリネーム処理
            trickGrid.innerHTML = trickItems.map(item => `
                <div id="trick-card-${item.id}" class="menu-card bg-purple-950/70 border border-purple-800/80 rounded-xl p-2.5 flex flex-col justify-between">
                    <div class="flex items-center justify-between text-[11px] font-bold text-purple-300">
                        <span>① ${item.name}</span>
                        <span class="text-[9px] text-purple-400">No.${item.id}</span>
                    </div>
                    <div class="my-1">
                        <div class="text-xs font-bold text-pink-100 truncate">${item.name}</div>
                        <div class="text-[10px] text-purple-300 truncate">${item.desc}</div>
                    </div>
                </div>
            `).join('');

            // ID部分の修正を含めた正しいグリッド生成
            trickGrid.innerHTML = trickItems.map(item => `
                <div id="trick-card-${item.id}" class="menu-card bg-purple-950/70 border border-purple-800/80 rounded-xl p-2.5 flex flex-col justify-between min-h-[65px]">
                    <div class="flex items-center justify-between text-[11px] font-bold text-purple-300">
                        <span>(${item.id}) TRICK</span>
                        <span class="text-[9px] text-purple-400">No.${item.id}</span>
                    </div>
                    <div class="my-0.5">
                        <div class="text-xs font-bold text-pink-100 truncate">${item.name}</div>
                        <div class="text-[10px] text-purple-300 truncate">${item.desc}</div>
                    </div>
                </div>
            `).join('');

            const treatGrid = document.getElementById('treat-grid');
            treatGrid.innerHTML = treatItems.map(item => `
                <div id="treat-card-${item.id}" class="menu-card bg-amber-950/50 border border-amber-800/80 rounded-xl p-2.5 flex flex-col justify-between min-h-[65px]">
                    <div class="flex items-center justify-between text-[11px] font-bold text-amber-300">
                        <span>(${item.id}) TREAT</span>
                        <span class="text-[9px] text-amber-400">No.${item.id}</span>
                    </div>
                    <div class="my-0.5">
                        <div class="text-xs font-bold text-amber-100 truncate">${item.name}</div>
                        <div class="text-[10px] text-amber-200/80 truncate">${item.desc}</div>
                    </div>
                </div>
            `).join('');
        }

        function addHistory(type, title, detail) {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            historyData.unshift({ type, title, detail, timeStr });
            if (historyData.length > 15) historyData.pop();
            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('history-list');
            if (historyData.length === 0) {
                container.innerHTML = '<div class="text-center text-purple-400/70 py-3 italic text-[11px]">まだ結果の履歴はありません</div>';
                return;
            }

            container.innerHTML = historyData.map(item => {
                let badgeColor = item.type === 'COIN' ? 'bg-amber-900/60 text-amber-300 border-amber-700' :
                                 item.type === 'TRICK' ? 'bg-purple-900/60 text-purple-300 border-purple-700' :
                                 'bg-amber-950/85 text-amber-200 border-amber-800';
                return `
                    <div class="bg-purple-900/20 border border-purple-800/40 rounded-lg p-1.5 flex items-center justify-between gap-2">
                        <div class="flex items-center gap-1.5 overflow-hidden">
                            <span class="text-[9px] px-1.5 py-0.5 rounded border ${badgeColor} font-bold shrink-0">${item.type}</span>
                            <div class="truncate">
                                <span class="font-bold text-pink-100 text-[11px]">${item.title}</span>
                                <span class="text-[10px] text-purple-300 ml-1">(${item.detail})</span>
                            </div>
                        </div>
                        <span class="text-[9px] text-purple-400 shrink-0">${item.timeStr}</span>
                    </div>
                `;
            }).join('');
        }

        function clearHistory() {
            historyData = [];
            renderHistory();
        }

        // コイントスアニメーション
        function tossCoin() {
            const coin = document.getElementById('coin');
            const btn = document.getElementById('coin-btn');
            const resultDiv = document.getElementById('coin-result');
            
            btn.disabled = true;
            resultDiv.innerHTML = '<span class="text-purple-300 animate-pulse">運命のコインが回転中...</span>';
            
            coin.classList.remove('animate-spin-coin');
            void coin.offsetWidth; 

            requestAnimationFrame(() => {
                coin.classList.add('animate-spin-coin');
            });

            setTimeout(() => {
                const isTrick = Math.random() < 0.5;
                const resultText = isTrick ? "TRICK" : "TREAT";
                
                document.getElementById('coin-text').innerText = isTrick ? "TRICK" : "TREAT";
                document.getElementById('coin-subtext').innerText = isTrick ? "✦" : "✦";
                
                resultDiv.innerHTML = `<span class="text-amber-400 font-black text-sm animate-bounce">✨ 結果：${resultText}ルート！ ✨</span>`;
                
                addHistory('COIN', `コイントス`, `${resultText}が出ました`);
                btn.disabled = false;
            }, 1000);
        }

        // ルーレット機能（6マス一覧連動版）
        function spinRoulette(type) {
            const items = type === 'trick' ? trickItems : treatItems;
            const btnEl = document.getElementById(`${type}-btn`);
            
            btnEl.disabled = true;

            items.forEach(item => {
                const card = document.getElementById(`${type}-card-${item.id}`);
                if(card) card.classList.remove('active-highlight');
            });

            let counter = 0;
            const maxCount = 14; 
            const intervalTime = 70;

            const timer = setInterval(() => {
                items.forEach(item => {
                    const card = document.getElementById(`${type}-card-${item.id}`);
                    if(card) card.classList.remove('active-highlight');
                });

                const randomItem = items[Math.floor(Math.random() * items.length)];
                const targetCard = document.getElementById(`${type}-card-${randomItem.id}`);
                if(targetCard) targetCard.classList.add('active-highlight');

                counter++;

                if (counter >= maxCount) {
                    clearInterval(timer);
                    const finalItem = items[Math.floor(Math.random() * items.length)];
                    
                    items.forEach(item => {
                        const card = document.getElementById(`${type}-card-${item.id}`);
                        if(card) card.classList.remove('active-highlight');
                    });
                    const finalCard = document.getElementById(`${type}-card-${finalItem.id}`);
                    if(finalCard) finalCard.classList.add('active-highlight');

                    addHistory(type.toUpperCase(), `【${finalItem.id}】${finalItem.name}`, finalItem.desc);
                    btnEl.disabled = false;
                }
            }, intervalTime);
        }

        // ページ読み込み時にグリッドを生成
        window.onload = () => {
            renderGrids();
        };
    </script>
</body>
</html>
